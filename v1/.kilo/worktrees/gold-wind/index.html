      );
    };

    // --- Component: Consultation Modal ---
    const ConsultationModal = ({ isOpen, onClose }) => {
      const [submitted, setSubmitted] = useState(false);
      const [formData, setFormData] = useState({
        name: "",
        email: "",
        phone: "",
        city: "",
        propertyType: "Private Villa",
        floors: "3",
        notes: ""
      });

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        setSubmitted(true);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl max-w-xl w-full p-8 md:p-10 shadow-2xl border border-champagne-300 relative max-h-[90vh] overflow-y-auto">
            <button
              onClick={onClose}
              className="absolute top-6 right-6 p-2 rounded-full text-stone-400 hover:text-mineral hover:bg-stone-100 transition"
            >
              <Icon name="x" size={20} />
            </button>

            {submitted ? (
              <div className="text-center py-10 space-y-4">
                <div className="w-16 h-16 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center mx-auto">
                  <Icon name="check" size={32} />
                </div>
                <h3 className="font-serif text-3xl text-mineral font-normal">Consultation Request Received</h3>
                <p className="text-stone-600 text-sm max-w-md mx-auto">
                  Thank you, <strong>{formData.name}</strong>. An Aurelia Senior Vertical Architect will contact you within 24 hours with feasibility drawings and custom finishing catalogues.
                </p>
                <button
                  onClick={() => { setSubmitted(false); onClose(); }}
                  className="bg-mineral text-white px-8 py-3 rounded-full text-xs uppercase tracking-widest font-medium"
                >
                  Close Window
                </button>
              </div>
            ) : (
              <div>
                <span className="text-[10px] uppercase tracking-widest text-champagne-700 font-semibold block mb-1">
                  Private Architectural Advisory
                </span>
                <h3 className="font-serif text-2xl sm:text-3xl font-light text-mineral mb-2">
                  Request Home Feasibility Assessment
                </h3>
                <p className="text-stone-500 text-xs mb-6">
                  Complimentary on-site or digital BIM study for architects, interior designers, and estate homeowners.
                </p>

                <form onSubmit={handleSubmit} className="space-y-4 text-left">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="text-[11px] uppercase tracking-wider text-stone-600 font-medium block mb-1">Your Full Name</label>
                      <input
                        required
                        type="text"
                        placeholder="Lady / Lord / Mr / Ms..."
                        value={formData.name}
                        onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                        className="w-full px-4 py-2.5 rounded-xl border border-stone-300 text-sm focus:outline-none focus:border-champagne-600"
                      />
                    </div>
                    <div>
                      <label className="text-[11px] uppercase tracking-wider text-stone-600 font-medium block mb-1">Email Address</label>
                      <input
                        required
                        type="email"
                        placeholder="client@estate.com"
                        value={formData.email}
                        onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                        className="w-full px-4 py-2.5 rounded-xl border border-stone-300 text-sm focus:outline-none focus:border-champagne-600"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="text-[11px] uppercase tracking-wider text-stone-600 font-medium block mb-1">Direct Telephone</label>
                      <input
                        required
                        type="tel"
                        placeholder="+1 (555) 000-0000"
                        value={formData.phone}
                        onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                        className="w-full px-4 py-2.5 rounded-xl border border-stone-300 text-sm focus:outline-none focus:border-champagne-600"
                      />
                    </div>
                    <div>
                      <label className="text-[11px] uppercase tracking-wider text-stone-600 font-medium block mb-1">Estate Location / City</label>
                      <input
                        required
                        type="text"
                        placeholder="Beverly Hills, London, Zurich..."
                        value={formData.city}
                        onChange={(e) => setFormData({ ...formData, city: e.target.value })}
                        className="w-full px-4 py-2.5 rounded-xl border border-stone-300 text-sm focus:outline-none focus:border-champagne-600"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="text-[11px] uppercase tracking-wider text-stone-600 font-medium block mb-1">Residence Type</label>
                      <select
                        value={formData.propertyType}
                        onChange={(e) => setFormData({ ...formData, propertyType: e.target.value })}
                        className="w-full px-4 py-2.5 rounded-xl border border-stone-300 text-sm focus:outline-none focus:border-champagne-600 bg-white"
                      >
                        <option>Private Villa</option>
                        <option>Penthouse / Duplex</option>
                        <option>Heritage / Listed Estate</option>
                        <option>Architectural New Build</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-[11px] uppercase tracking-wider text-stone-600 font-medium block mb-1">Number of Stops</label>
                      <select
                        value={formData.floors}
                        onChange={(e) => setFormData({ ...formData, floors: e.target.value })}
                        className="w-full px-4 py-2.5 rounded-xl border border-stone-300 text-sm focus:outline-none focus:border-champagne-600 bg-white"
                      >
                        <option>2 Floors (G + 1)</option>
                        <option>3 Floors (G + 2)</option>
                        <option>4 Floors (G + 3)</option>
                        <option>5+ Floors</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="text-[11px] uppercase tracking-wider text-stone-600 font-medium block mb-1">Special Architectural Notes / Dimensions</label>
                    <textarea
                      rows="2"
                      placeholder="e.g. Center of spiral staircase, desire champagne titanium frames..."
                      value={formData.notes}
                      onChange={(e) => setFormData({ ...formData, notes: e.target.value })}
                      className="w-full px-4 py-2 rounded-xl border border-stone-300 text-sm focus:outline-none focus:border-champagne-600"
                    ></textarea>
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-mineral hover:bg-black text-alabaster py-3.5 rounded-full text-xs uppercase tracking-[0.2em] font-medium transition shadow-lg mt-2"
                  >
                    Submit Advisory Request
                  </button>
                </form>
              </div>
            )}
          </div>
        </div>
      );
    };

    // --- Component: Model Dossier Modal ---
    const ModelDossierModal = ({ model, onClose, openConsultationModal }) => {
      if (!model) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md">
          <div className="bg-white rounded-3xl max-w-3xl w-full p-8 md:p-10 shadow-2xl relative max-h-[90vh] overflow-y-auto border border-champagne-300">
            <button
              onClick={onClose}
              className="absolute top-6 right-6 p-2 rounded-full text-stone-400 hover:text-mineral hover:bg-stone-100 transition"
            >
              <Icon name="x" size={20} />
            </button>

            <span className="text-[10px] uppercase tracking-widest text-champagne-700 font-semibold block mb-1">Technical Dossier</span>
            <h2 className="font-serif text-3xl font-normal text-mineral">{model.name}</h2>
            <p className="text-champagne-700 font-serif italic text-base mb-4">{model.tagline}</p>

            <div className="rounded-2xl overflow-hidden aspect-video mb-6">
              <img src={model.heroImg} alt={model.name} className="w-full h-full object-cover" />
            </div>

            <p className="text-stone-600 text-sm leading-relaxed mb-6">{model.description}</p>

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 p-4 rounded-xl bg-stone-50 border border-stone-200 mb-6">
              <div>
                <span className="text-[10px] uppercase tracking-wider text-stone-400 block font-mono">Capacity</span>
                <span className="text-xs font-semibold text-mineral">{model.capacity}</span>
              </div>
              <div>
                <span className="text-[10px] uppercase tracking-wider text-stone-400 block font-mono">Headroom</span>
                <span className="text-xs font-semibold text-mineral">{model.headroom}</span>
              </div>
              <div>
                <span className="text-[10px] uppercase tracking-wider text-stone-400 block font-mono">Pit Requirement</span>
                <span className="text-xs font-semibold text-emerald-600">{model.pitRequirement}</span>
              </div>
              <div>
                <span className="text-[10px] uppercase tracking-wider text-stone-400 block font-mono">Max Travel</span>
                <span className="text-xs font-semibold text-mineral">{model.stops}</span>
              </div>
            </div>

            <div className="space-y-2 mb-6">
              <h4 className="text-xs uppercase tracking-wider font-semibold text-mineral">Engineered Specifications</h4>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs text-stone-600">
                {model.specs.map((sp, idx) => (
                  <div key={idx} className="p-2.5 rounded-lg border border-stone-100 bg-stone-50 flex justify-between">
                    <span className="text-stone-400">{sp.label}:</span>
                    <span className="font-medium text-mineral">{sp.value}</span>
                  </div>
                ))}
              </div>
            </div>

            <div className="flex gap-4">
              <button
                onClick={() => { onClose(); openConsultationModal(); }}
                className="flex-1 bg-mineral text-white py-3.5 rounded-full text-xs uppercase tracking-widest font-medium hover:bg-black transition shadow"
              >
                Inquire For This Model
              </button>
              <button
                onClick={onClose}
                className="px-6 py-3.5 rounded-full border border-stone-300 text-stone-700 text-xs uppercase tracking-widest hover:bg-stone-50"
              >
                Back
              </button>
            </div>
          </div>
        </div>
      );
    };

    // --- Component: Gallery Detail Modal ---
    const GalleryDetailModal = ({ item, onClose, openConsultationModal }) => {
      if (!item) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-md">
          <div className="bg-white rounded-3xl max-w-2xl w-full p-8 shadow-2xl relative max-h-[90vh] overflow-y-auto border border-champagne-300">
            <button
              onClick={onClose}
              className="absolute top-6 right-6 p-2 rounded-full text-stone-400 hover:text-mineral hover:bg-stone-100 transition"
            >
              <Icon name="x" size={20} />
            </button>

            <span className="text-[10px] uppercase tracking-widest text-champagne-700 font-semibold block mb-1">Architectural Case Study</span>
            <h2 className="font-serif text-3xl font-light text-mineral mb-1">{item.title}</h2>
            <div className="flex items-center space-x-3 text-xs text-stone-500 mb-4">
              <span>{item.location}</span>
              <span>•</span>
              <span className="text-champagne-800 font-medium">{item.model}</span>
            </div>

            <div className="rounded-2xl overflow-hidden aspect-[16/10] mb-6">
              <img src={item.img} alt={item.title} className="w-full h-full object-cover" />
            </div>

            <p className="text-stone-600 text-sm leading-relaxed mb-6">
              {item.desc} Completed with custom concealed wiring, acoustic dampening mounts, and personalized crystal glass cladding matching the property’s historical masonry.
            </p>

            <div className="flex gap-4">
              <button
                onClick={() => { onClose(); openConsultationModal(); }}
                className="flex-1 bg-mineral text-white py-3.5 rounded-full text-xs uppercase tracking-widest font-medium hover:bg-black transition"
              >
                Request Similar Design
              </button>
              <button
                onClick={onClose}
                className="px-6 py-3.5 rounded-full border border-stone-300 text-stone-700 text-xs uppercase tracking-widest hover:bg-stone-50"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      );
    };

    // --- Main App Root ---
    function App() {
      const [activePage, setActivePage] = useState('home');
      const [isConsultationOpen, setIsConsultationOpen] = useState(false);
      const [selectedModelModal, setSelectedModelModal] = useState(null);
      const [selectedGalleryModal, setSelectedGalleryModal] = useState(null);

      return (
        <div className="min-h-screen flex flex-col bg-alabaster">
          {/* Navigation Bar */}
          <Navigation
            activePage={activePage}
            setActivePage={setActivePage}
            openConsultationModal={() => setIsConsultationOpen(true)}
          />

          {/* Dynamic Page Router */}
          <main className="flex-grow">
            {activePage === 'home' && (
              <>
                <HeroSection
                  setActivePage={setActivePage}
                  openConsultationModal={() => setIsConsultationOpen(true)}
                />
                <ProductShowcase
                  setActivePage={setActivePage}
                  setSelectedModelModal={setSelectedModelModal}
                />
                <CustomizerStudio
                  openConsultationModal={() => setIsConsultationOpen(true)}
                />
                <TechnologySection />
                <CalculatorSection
                  openConsultationModal={() => setIsConsultationOpen(true)}
                />
                <InstallationProcess />
                <GallerySection
                  setSelectedGalleryModal={setSelectedGalleryModal}
                />
                <AboutSection />
                <div id="faq">
                  <FAQSection />
                </div>
                <FinalCTA
                  openConsultationModal={() => setIsConsultationOpen(true)}
                />
              </>
            )}

            {activePage === 'products' && (
              <div className="pt-24 pb-12">
                <ProductShowcase
                  setActivePage={setActivePage}
                  setSelectedModelModal={setSelectedModelModal}
                />
                <TechnologySection />
                <FinalCTA openConsultationModal={() => setIsConsultationOpen(true)} />
              </div>
            )}

            {activePage === 'customizer' && (
              <div className="pt-24 pb-12">
                <CustomizerStudio openConsultationModal={() => setIsConsultationOpen(true)} />
                <CalculatorSection openConsultationModal={() => setIsConsultationOpen(true)} />
              </div>
            )}

            {activePage === 'technology' && (
              <div className="pt-24">
                <TechnologySection />
                <InstallationProcess />
                <FinalCTA openConsultationModal={() => setIsConsultationOpen(true)} />
              </div>
            )}

            {activePage === 'calculator' && (
              <div className="pt-24 pb-12">
                <CalculatorSection openConsultationModal={() => setIsConsultationOpen(true)} />
                <FAQSection />
              </div>
            )}

            {activePage === 'gallery' && (
              <div className="pt-24 pb-12">
                <GallerySection setSelectedGalleryModal={setSelectedGalleryModal} />
                <FinalCTA openConsultationModal={() => setIsConsultationOpen(true)} />
              </div>
            )}

            {activePage === 'about' && (
              <div className="pt-24 pb-12">
                <AboutSection />
                <InstallationProcess />
                <FinalCTA openConsultationModal={() => setIsConsultationOpen(true)} />
              </div>
            )}
          </main>

          {/* Persistent Footer */}
          <Footer
            setActivePage={setActivePage}
            openConsultationModal={() => setIsConsultationOpen(true)}
          />

          {/* Consultation Lead Modal */}
          <ConsultationModal
            isOpen={isConsultationOpen}
            onClose={() => setIsConsultationOpen(false)}
          />

          {/* Model Specification Dossier Modal */}
          <ModelDossierModal
            model={selectedModelModal}
            onClose={() => setSelectedModelModal(null)}
            openConsultationModal={() => setIsConsultationOpen(true)}
          />

          {/* Gallery Detail Modal */}
          <GalleryDetailModal
            item={selectedGalleryModal}
            onClose={() => setSelectedGalleryModal(null)}
            openConsultationModal={() => setIsConsultationOpen(true)}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
